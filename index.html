</head><body>
<meta name="theme-color" content="#060809">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>/* Layout: fixed left sidebar (drawer on phone) + scoreboard-style main board; LED digits for money, condensed sports type for labels */
:root {
  --acc-base: #ffb000;
  --bg: #0a0c0f; --panel: #11151a; --panel2: #171c23; --ink: #e9eef3; --muted: #8b96a3; --line: #242b34;
  --acc: var(--acc-base); --acc-ink: #0a0c0f; --pos: #3ddc84; --neg: #ff5d5d;
  --side: #060809; --side-ink: #a9b3be; --cell: #0c0f13; --overlay: rgba(0,0,0,.6);
  --glow: 0 0 12px color-mix(in srgb, var(--acc) 45%, transparent);
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --led: "Share Tech Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e2e5e9; --panel: #ffffff; --panel2: #f2f4f6; --ink: #13171c; --muted: #59626e; --line: #d2d7dd;
  --acc: color-mix(in srgb, var(--acc-base) 62%, #000); --acc-ink: #fff; --pos: #157a3f; --neg: #c42727;
  --side: #13171c; --side-ink: #b6c0ca; --cell: #f2f4f6; --overlay: rgba(10,14,20,.45); --glow: none; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #e2e5e9; --panel: #ffffff; --panel2: #f2f4f6; --ink: #13171c; --muted: #59626e; --line: #d2d7dd;
  --acc: color-mix(in srgb, var(--acc-base) 62%, #000); --acc-ink: #fff; --pos: #157a3f; --neg: #c42727;
  --side: #13171c; --side-ink: #b6c0ca; --cell: #f2f4f6; --overlay: rgba(10,14,20,.45); --glow: none; color-scheme: light; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
a { color: var(--acc); }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; font-weight: 800; line-height: 1; }
h2 { font-size: 1.05rem; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 a { margin-left: auto; font-size: .85rem; text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 600; }
.num, .led { font-family: var(--led); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }
small { font-size: .82rem; }

/* shell */
.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; height: 100dvh; overflow-y: auto; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.7rem; letter-spacing: .06em; color: #fff; padding: 0 10px 12px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--acc-base); box-shadow: 0 0 10px var(--acc-base); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a { color: var(--side-ink); text-decoration: none; font-family: var(--display); font-weight: 600; font-size: 1.08rem; letter-spacing: .04em; text-transform: uppercase; padding: 7px 10px; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
.side nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.side nav a.on { background: var(--acc-base); color: #0a0c0f; }
.side nav .sep { height: 1px; background: rgba(255,255,255,.08); margin: 8px 6px; }
.side .foot { margin-top: auto; padding: 12px 8px 0; display: flex; flex-direction: column; gap: 8px; font-size: .8rem; }
#sync-status[data-ok="0"] { color: #ff8080; } #sync-status[data-ok="1"] { color: #6fe3a3; }
.side .foot button { background: transparent; border: 1px solid rgba(255,255,255,.15); color: var(--side-ink); }
.main { min-width: 0; }
.topbar { display: none; }
.view { max-width: 1240px; margin: 0 auto; padding-inline: 24px; padding-block: 22px 60px; display: flex; flex-direction: column; gap: 18px; }
.scrim { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: 250px; transform: translateX(-105%); transition: transform .2s; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .app.menu .side { transform: none; }
  .app.menu .scrim { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 39; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--side); color: #fff; align-items: center; gap: 10px; padding: 10px 16px; }
  .topbar b { font-family: var(--display); font-size: 1.35rem; letter-spacing: .06em; flex: 1; }
  .topbar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.2); }
  .view { padding-inline: 16px; padding-block: 16px 60px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* controls */
button, .btn { font: 600 .95rem var(--body); cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 8px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; justify-content: center; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--acc); }
.btn.pri { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
.btn.danger { color: var(--neg); }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn.ghost { background: transparent; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
input, select, textarea { font: 400 1rem var(--body); color: var(--ink); background: var(--cell); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--acc); }
label.f { display: flex; flex-direction: column; gap: 4px; font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
label.chk { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
.fgrid .wide { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
legend { font: 700 .95rem var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 0 6px; color: var(--acc); }

/* page */
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spacer { flex: 1; }

/* scoreboard tiles */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 2px; background: var(--line); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.tile { background: var(--cell); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile .lbl { font: 600 .78rem var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.tile .led { font-size: clamp(1.4rem, 3.4vw, 2.1rem); color: var(--acc); text-shadow: var(--glow); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) { .board { grid-template-columns: 1fr 1fr; } .board .tile:last-child:nth-child(odd) { grid-column: 1 / -1; } }
.tile .led.pos { color: var(--pos); } .tile .led.neg { color: var(--neg); }
.tile small { color: var(--muted); }

/* pills */
.pill { display: inline-flex; align-items: center; font: 700 .68rem var(--display); letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.st-in_stock { color: var(--pos); } .st-listed { color: var(--acc); } .st-grading { color: #8fb8ff; } .st-sold { color: var(--muted); } .st-written_off { color: var(--neg); }
.badge { font: 700 .66rem var(--display); letter-spacing: .06em; padding: 1px 5px; border-radius: 3px; background: rgba(0,0,0,.55); color: #fff; }
.code { font-family: var(--led); font-size: .8rem; color: var(--muted); }

/* inventory */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input[type=search] { flex: 1 1 220px; }
.toolbar select, .toolbar .small { width: auto; flex: 0 1 auto; }
.toolbar .small { width: 92px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button.on { background: var(--acc); color: var(--acc-ink); }
.summary { color: var(--muted); font-size: .9rem; }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; }
.ctile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; min-width: 0; }
.ctile:hover { border-color: var(--acc); }
.art { aspect-ratio: 5 / 7; max-width: 100%; background: var(--panel2); position: relative; overflow: hidden; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art.gen { background: linear-gradient(155deg, hsl(var(--h) 65% 42%), hsl(calc(var(--h) + 40) 55% 18%)); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
.art.gen::before { content: ""; position: absolute; inset: 7px; border: 2px solid rgba(255,255,255,.55); border-radius: 4px; }
.art.gen > span { font: 800 2.4rem var(--display); line-height: 1; position: relative; }
.art.gen > small { font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; opacity: .85; position: relative; }
.art .badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 3px; flex-wrap: wrap; z-index: 1; }
.ct-body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ct-body b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-body small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ct-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.ct-money { display: flex; justify-content: space-between; margin-top: 4px; font-size: .9rem; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem; }
.t th { font: 700 .74rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--panel2); white-space: nowrap; position: sticky; top: 0; }
.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t tr:last-child td { border-bottom: 0; }
.t td.r, .t th.r { text-align: right; }
.t tbody tr.link { cursor: pointer; }
.t tbody tr.link:hover td { background: var(--panel2); }
.t tfoot td { font-weight: 700; border-top: 2px solid var(--line); border-bottom: 0; }

/* card detail */
.detail { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.photo-col { display: flex; flex-direction: column; gap: 10px; }
.photo-col .art { width: min(100%, 280px); border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; }
.qrbox { background: #fff; padding: 10px; border-radius: 8px; width: 132px; }
.qrbox svg { display: block; width: 100%; height: auto; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; }
.kv div { display: flex; flex-direction: column; min-width: 0; }
.kv span { font: 600 .72rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv b { font-weight: 600; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; }
.list .li { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list .li:last-child { border-bottom: 0; }
.list .li .grow { flex: 1; min-width: 0; }
.list .li .grow b, .list .li .grow small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }

/* receipts */
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.rtile { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; color: var(--ink); font-weight: 400; }
.rtile .thumb { aspect-ratio: 4 / 5; max-width: 100%; background: var(--panel2); display: flex; align-items: center; justify-content: center; overflow: hidden; width: 100%; }
.rtile .thumb img { width: 100%; height: 100%; object-fit: cover; }
.rtile .pdf { font: 800 1.6rem var(--display); color: var(--neg); }
.rtile .meta { padding: 7px 9px; display: flex; flex-direction: column; font-size: .82rem; gap: 1px; width: 100%; }

/* modal */
.modal { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; overflow-y: auto; }
.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(760px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet.narrow { width: min(480px, 100%); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { color: var(--ink); font-size: 1.4rem; }
.sheet-head .x { margin-left: auto; }
.sheet-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; position: sticky; bottom: -18px; background: var(--panel); padding: 12px 0 2px; border-top: 1px solid var(--line); }
.warn { border: 1px solid var(--acc); background: color-mix(in srgb, var(--acc) 12%, transparent); border-radius: 8px; padding: 10px 12px; font-size: .92rem; }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 2px; background: var(--line); border-radius: 8px; overflow: hidden; }
.calc div { background: var(--cell); padding: 8px 10px; display: flex; flex-direction: column; }
.calc span { font: 600 .7rem var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.calc b { font-family: var(--led); font-size: 1.1rem; }
.viewer { position: fixed; inset: 0; z-index: 70; background: #000; display: flex; flex-direction: column; }
.viewer .vbar { display: flex; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px; align-items: center; color: #fff; flex-wrap: wrap; }
.viewer .vbar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.viewer .vbar button, .viewer .vbar a { background: #1b1f25; color: #fff; border-color: #333; }
.viewer .vbody { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; touch-action: pinch-zoom pan-x pan-y; }
.viewer .vbody img { max-width: 100%; transition: none; }
.viewer .vbody.zoom img { max-width: none; width: 220%; }
.viewer iframe { width: 100%; height: 100%; border: 0; background: #fff; }
.pick-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.pick-list label { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: .92rem; }
.pick-list label:last-child { border-bottom: 0; }

/* 3D card */
.c3d { display: flex; flex-direction: column; gap: 8px; }
.c3d-stage { position: relative; }
.c3d.is3d .c3d-stage > .art { display: none; }
.c3d-canvas { display: block; width: 100%; aspect-ratio: 5 / 6.6; max-width: 100%; touch-action: none; cursor: grab; border-radius: 12px; background: radial-gradient(ellipse at 50% 40%, var(--panel2), var(--bg) 75%); }
.c3d-canvas:active { cursor: grabbing; }
.c3d:not(.is3d) .c3d-ctl button[data-act^="c3d"]:not([data-act="c3dFull"]), .c3d:not(.is3d) .c3d-hint { display: none; }
.c3d-full .c3d-stage { display: flex; }
.c3d-full .c3d-canvas { aspect-ratio: auto; height: 100%; border-radius: 0; background: radial-gradient(ellipse at 50% 45%, #232a33, #000 80%); }
@media (max-width: 760px) { .photo-col .c3d { width: min(100%, 360px); align-self: center; } }

/* straighten editor */
.st-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.st-stage { position: relative; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 100%; }
.st-stage canvas#st-img { display: block; border-radius: 6px; max-width: 100%; }
.st-stage svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.st-h { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 3px solid #fff; background: var(--acc-base); padding: 0; box-shadow: 0 0 0 2px rgba(0,0,0,.5); cursor: grab; touch-action: none; }
.st-h::after { content: ""; position: absolute; inset: -12px; } /* bigger touch target */
#st-loupe { position: absolute; width: 140px; height: 140px; pointer-events: none; border-radius: 50%; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.st-prev { display: flex; flex-direction: column; gap: 6px; }
.st-prev canvas { width: 200px; height: 280px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }
@media (max-width: 700px) { .st-prev canvas { width: 140px; height: 196px; } }

/* batch scan */
.bs-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 14px; align-items: start; }
.bs-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.bs-imgs img, .bs-noback { width: 100%; aspect-ratio: 5 / 7; max-width: 100%; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); background: var(--panel2); }
.bs-noback { display: flex; align-items: center; justify-content: center; font-size: .75rem; color: var(--muted); }
.bs-text { white-space: pre-wrap; font: .78rem/1.4 var(--led); color: var(--muted); max-height: 160px; overflow: auto; margin: 6px 0 0; }
@media (max-width: 640px) { .bs-grid { grid-template-columns: minmax(0, 1fr); } .bs-imgs { max-width: 220px; } }

/* toast */
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(520px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 9px; font-weight: 600; display: flex; gap: 12px; align-items: center; pointer-events: auto; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
.toast button { background: transparent; color: var(--bg); border-color: currentColor; padding: 3px 9px; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--led); }
.legend { display: flex; gap: 14px; font-size: .82rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.bar-cell { display: flex; align-items: center; gap: 8px; min-width: 140px; }
.bar-cell .bar { height: 8px; border-radius: 4px; background: var(--pos); }
.bar-cell .bar.neg { background: var(--neg); }

/* niche finder */
.hunt { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.hcard { background: var(--cell); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; align-items: flex-start; justify-content: flex-start; white-space: normal; text-align: left; color: var(--ink); }
.hcard .k { font: 600 .74rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hcard .v { font: 800 1.35rem var(--display); line-height: 1.1; overflow-wrap: anywhere; }
.hcard .m { font-family: var(--led); font-size: .95rem; color: var(--acc); text-shadow: var(--glow); }

<script>/* Dugout data layer: IndexedDB on this device, with an in-memory cache. */
const STORES = ['cards', 'txns', 'pickups', 'receipts', 'files', 'locations', 'expenses', 'snaps', 'meta'];
const SYNC_STORES = ['cards', 'txns', 'pickups', 'receipts', 'locations', 'expenses', 'snaps'];
const DB = { db: null };
const S = { cards: [], txns: [], pickups: [], receipts: [], locations: [], expenses: [], snaps: [], settings: null };

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const today = () => new Date().toLocaleDateString('en-CA');

function idbOpen() {
  return new Promise(res => {
    let r;
    try { r = indexedDB.open('dugout', 1); } catch (e) { return res(); }
    r.onupgradeneeded = () => {
      const d = r.result;
      STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
    };
    r.onsuccess = () => { DB.db = r.result; res(); };
    r.onerror = () => res();
  });
}
function idbReq(store, mode, fn) {
  if (!DB.db) return Promise.resolve(null);
  return new Promise((res, rej) => {
    let t;
    try { t = DB.db.transaction(store, mode); } catch (e) { return rej(e); }
    const st = t.objectStore(store);
    let out = null;
    const q = fn(st);
    if (q) q.onsuccess = () => { out = q.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const idb = {
  all: s => idbReq(s, 'readonly', st => st.getAll()).then(r => r || []),
  get: (s, id) => idbReq(s, 'readonly', st => st.get(id)),
  put: (s, v) => idbReq(s, 'readwrite', st => st.put(v)),
  del: (s, id) => idbReq(s, 'readwrite', st => st.delete(id)),
  putMany: (s, arr) => idbReq(s, 'readwrite', st => { arr.forEach(v => st.put(v)); }),
  keys: s => idbReq(s, 'readonly', st => st.getAllKeys()).then(r => r || []),
};

async function loadAll() {
  await idbOpen();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  for (const s of SYNC_STORES) S[s] = await idb.all(s);
  const set = await idb.get('meta', 'settings');
  S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), set || {});
}

let onChange = () => {};
async function save(store, obj, opts = {}) {
  if (!opts.keepStamp) obj.updatedAt = nowISO();
  const arr = S[store];
  const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  try { await idb.put(store, obj); } catch (e) { toast('Could not save on this device: ' + e.message); }
  if (!opts.quiet) onChange(store);
  return obj;
}
async function hardDelete(store, id) {
  S[store] = S[store].filter(x => x.id !== id);
  try { await idb.del(store, id); } catch (e) {}
}
async function saveSettings() {
  S.settings.updatedAt = nowISO();
  try { await idb.put('meta', S.settings); } catch (e) {}
  onChange('settings');
}
async function getMeta(id) { try { return await idb.get('meta', id); } catch (e) { return null; } }
async function setMeta(id, v) { try { await idb.put('meta', Object.assign({ id }, v)); } catch (e) {} }

/* ---- files (photos, receipts) ---- */
const memFiles = new Map();
const urlCache = new Map();
async function fileSave(blob, name, id) {
  id = id || 'f_' + uid();
  const rec = { id, blob, name: name || '', type: blob.type, size: blob.size, createdAt: nowISO() };
  if (DB.db) { try { await idb.put('files', rec); } catch (e) { memFiles.set(id, rec); } } else memFiles.set(id, rec);
  return id;
}
async function fileGet(id) {
  if (!id) return null;
  if (memFiles.has(id)) return memFiles.get(id);
  try { return await idb.get('files', id); } catch (e) { return null; }
}
async function fileURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const r = await fileGet(id);
  if (!r) return null;
  const u = URL.createObjectURL(r.blob);
  urlCache.set(id, u);
  return u;
}
async function fileDel(id) {
  memFiles.delete(id);
  if (urlCache.has(id)) { URL.revokeObjectURL(urlCache.get(id)); urlCache.delete(id); }
  try { await idb.del('files', id); } catch (e) {}
}
async function fileIds() { const k = DB.db ? await idb.keys('files') : []; return new Set([...k, ...memFiles.keys()]); }
function referencedFileIds() {
  const ids = new Set();
  S.cards.forEach(c => { if (!c.purged) ['front', 'back', 'frontOrig', 'backOrig'].forEach(k => c[k] && ids.add(c[k])); });
  S.receipts.forEach(r => { if (!r.purged && r.fileId) ids.add(r.fileId); });
  S.expenses.forEach(x => { if (!x.purged && x.fileId) ids.add(x.fileId); });
  S.pickups.forEach(p => { if (!p.purged && p.photo) ids.add(p.photo); });
  return ids;
}

async function compressImage(file, max = 1600, q = 0.85) {
  if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif') return file;
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    return out && out.size < file.size ? out : file;
  } catch (e) { return file; }
}

/* ---- merge (used by sync and backup restore) ---- */
async function mergeData(data) {
  let changed = 0;
  for (const s of SYNC_STORES) {
    const incoming = (data.stores && data.stores[s]) || [];
    const map = new Map(S[s].map(x => [x.id, x]));
    const toPut = [];
    for (const r of incoming) {
      const cur = map.get(r.id);
      if (!cur || (r.updatedAt || '') > (cur.updatedAt || '')) { map.set(r.id, r); toPut.push(r); }
    }
    if (toPut.length) { S[s] = [...map.values()]; changed += toPut.length; try { await idb.putMany(s, toPut); } catch (e) {} }
  }
  const rs = data.stores && data.stores.settings && data.stores.settings[0];
  if (rs && (rs.updatedAt || '') > (S.settings.updatedAt || '')) {
    S.settings = Object.assign(structuredClone(DEFAULT_SETTINGS), rs);
    try { await idb.put('meta', S.settings); } catch (e) {}
    changed++;
  }
  changed += await fixDuplicateCodes();
  return changed;
}
async function fixDuplicateCodes() {
  const seen = new Map(); let n = 0;
  const cards = [...S.cards].sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
  for (const c of cards) {
    if (c.purged || !c.code) continue;
    if (seen.has(c.code)) { c.code = nextCode(); await save('cards', c, { quiet: true }); n++; }
    seen.set(c.code, c.id);
  }
  return n;
}
function exportData() {
  const stores = {};
  SYNC_STORES.forEach(s => { stores[s] = S[s]; });
  stores.settings = [S.settings];
  return { app: 'dugout', version: 1, exportedAt: nowISO(), stores };
}

/* ---- blob/base64 ---- */
function blobToB64(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); });
}
function b64ToBlob(b64, type) {
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: type || 'application/octet-stream' });
}
function utf8ToB64(str) { return blobToB64(new Blob([str], { type: 'application/json' })); }

/* Dugout sync: keeps iPhone and PC in step through a private GitHub repo you own.
   data.json holds the records; files/<id> holds photos and receipts. */
const Sync = { busy: false, timer: null, status: '', ok: null };

function syncCfg() { try { return JSON.parse(localStorage.getItem('dugout.sync') || 'null'); } catch (e) { return null; } }
function setSyncCfg(c) { try { c ? localStorage.setItem('dugout.sync', JSON.stringify(c)) : localStorage.removeItem('dugout.sync'); } catch (e) {} }

async function gh(path, opt = {}) {
  const c = syncCfg();
  const enc = path.split('/').map(encodeURIComponent).join('/');
  const ref = opt.method && opt.method !== 'GET' ? '' : '?ref=' + encodeURIComponent(c.branch || 'main');
  const headers = {
    Authorization: 'Bearer ' + c.token,
    Accept: opt.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  };
  if (opt.body) headers['Content-Type'] = 'application/json';
  return fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${enc}${ref}`, {
    method: opt.method || 'GET', headers, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store',
  });
}

function setSyncStatus(msg, ok) { Sync.status = msg; Sync.ok = ok; const el = document.getElementById('sync-status'); if (el) { el.textContent = msg; el.dataset.ok = ok === true ? '1' : ok === false ? '0' : ''; } }

function scheduleSync() {
  if (!syncCfg()) return;
  clearTimeout(Sync.timer);
  Sync.timer = setTimeout(() => syncNow(), 8000);
}

async function syncNow(manual) {
  const c = syncCfg();
  if (!c) { if (manual) toast('Set up sync in Settings first'); return; }
  if (Sync.busy) return;
  if (!navigator.onLine) { setSyncStatus('Offline · will sync later', null); return; }
  Sync.busy = true; setSyncStatus('Syncing…', null);
  try {
    for (let attempt = 0; attempt < 2; attempt++) {
      // 1. pull
      let sha = null;
      const head = await gh('data.json');
      if (head.status === 200) {
        sha = (await head.json()).sha;
        const raw = await gh('data.json', { raw: true });
        if (!raw.ok) throw new Error('could not read data.json (' + raw.status + ')');
        const remote = await raw.json();
        const changed = await mergeData(remote);
        await pullFiles(remote.files || []);
        if (changed) onChange('sync');
      } else if (head.status === 401 || head.status === 403) {
        throw new Error('GitHub rejected the token. Check it has Contents read/write on this repo.');
      } else if (head.status === 404) {
        const repoCheck = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`, { headers: { Authorization: 'Bearer ' + c.token } });
        if (repoCheck.status === 404) throw new Error('Repo not found. Create it on GitHub first (private).');
      } else throw new Error('GitHub answered ' + head.status);
      // 2. push files we haven't uploaded yet
      await pushFiles();
      // 3. push records
      const payload = exportData();
      payload.files = await fileIndex();
      const body = { message: 'Dugout sync ' + new Date().toLocaleString(), content: await utf8ToB64(JSON.stringify(payload)), branch: c.branch || 'main' };
      if (sha) body.sha = sha;
      const put = await gh('data.json', { method: 'PUT', body });
      if (put.ok) break;
      if ((put.status === 409 || put.status === 422) && attempt === 0) continue; // someone else synced in between: pull again
      throw new Error('upload failed (' + put.status + ')');
    }
    await setMeta('sync', { last: nowISO() });
    setSyncStatus('Synced ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }), true);
  } catch (e) {
    setSyncStatus('Sync failed: ' + e.message, false);
    if (manual) toast('Sync failed: ' + e.message);
  } finally { Sync.busy = false; }
}

async function syncedSet() { const m = await getMeta('syncedFiles'); return new Set((m && m.ids) || []); }
async function fileIndex() {
  const out = [];
  for (const id of referencedFileIds()) { const f = await fileGet(id); if (f) out.push({ id, type: f.type, name: f.name }); }
  return out;
}
async function pushFiles() {
  const done = await syncedSet();
  const have = await fileIds();
  let n = 0;
  for (const id of referencedFileIds()) {
    if (done.has(id) || !have.has(id)) continue;
    const f = await fileGet(id);
    if (!f) continue;
    setSyncStatus('Uploading photos… ' + (++n), null);
    const r = await gh('files/' + id, { method: 'PUT', body: { message: 'file ' + id, content: await blobToB64(f.blob), branch: syncCfg().branch || 'main' } });
    if (r.ok || r.status === 422) done.add(id); // 422 = already there
    else throw new Error('photo upload failed (' + r.status + ')');
  }
  await setMeta('syncedFiles', { ids: [...done] });
}
async function pullFiles(index) {
  const have = await fileIds();
  const types = new Map(index.map(f => [f.id, f]));
  const done = await syncedSet();
  let n = 0;
  for (const id of referencedFileIds()) {
    if (have.has(id)) continue;
    setSyncStatus('Downloading photos… ' + (++n), null);
    const r = await gh('files/' + id, { raw: true });
    if (!r.ok) continue;
    const blob = await r.blob();
    const meta = types.get(id) || {};
    await fileSave(new Blob([blob], { type: meta.type || blob.type }), meta.name, id);
    done.add(id);
  }
  await setMeta('syncedFiles', { ids: [...done] });
}

/* ---- backup zip (works with or without sync) ---- */
async function downloadBackup() {
  if (!window.JSZip) return toast('Backup tool did not load. Check your connection.');
  const zip = new JSZip();
  const data = exportData();
  data.files = await fileIndex();
  zip.file('data.json', JSON.stringify(data));
  for (const f of data.files) { const r = await fileGet(f.id); if (r) zip.file('files/' + f.id, r.blob); }
  const blob = await zip.generateAsync({ type: 'blob' });
  download(blob, `dugout-backup-${today()}.zip`);
  await setMeta('backup', { last: nowISO() });
  S.lastBackup = nowISO();
  toast('Backup downloaded');
}
async function restoreBackup(file) {
  if (!window.JSZip) return toast('Backup tool did not load.');
  try {
    const zip = await JSZip.loadAsync(file);
    const data = JSON.parse(await zip.file('data.json').async('string'));
    const changed = await mergeData(data);
    for (const f of data.files || []) {
      const e = zip.file('files/' + f.id);
      if (e) await fileSave(new Blob([await e.async('blob')], { type: f.type }), f.name, f.id);
    }
    onChange('restore');
    toast(`Restored. ${changed} records added or updated.`);
  } catch (e) { toast('That file is not a Dugout backup: ' + e.message); }
}

/* Dugout core: constants, helpers, shell, router, home, inventory, card page */
const PLATFORMS = ['eBay', 'Whatnot', 'Facebook Marketplace', 'Card show', 'Local card shop', 'COMC', 'Fanatics Collect', 'MySlabs', 'Mercari', 'Instagram', 'Trade', 'Other'];
const SPORTS = ['Basketball', 'Football', 'Baseball', 'Hockey', 'Soccer', 'Other'];
const GRADERS = ['PSA', 'BGS', 'SGC', 'CGC', 'TAG', 'Other'];
const CONDITIONS = ['Mint', 'Near Mint-Mint', 'Near Mint', 'Excellent-Mint', 'Excellent', 'Very Good', 'Good', 'Poor'];
const STATUS = { in_stock: 'In stock', listed: 'Listed', grading: 'At grading', sold: 'Sold', written_off: 'Written off' };
const ACTIVE = ['in_stock', 'listed', 'grading'];
const ACCENTS = { Amber: '#ffb000', Red: '#ff4b3e', Blue: '#3fa2ff', Green: '#2fd27a', Purple: '#b47cff' };
const EXPENSE_CATS = ['Supplies (sleeves, top loaders)', 'Shipping supplies', 'Card show table / entry', 'Storage', 'Software / subscriptions', 'Other'];
const DEFAULT_SETTINGS = {
  id: 'settings', prefix: 'AJ-', digits: 4, accent: '#ffb000', view: 'grid', savedFilters: [],
  fees: { 'eBay': { pct: 13.25, flat: 0.40 }, 'Whatnot': { pct: 10.9, flat: 0.30 }, 'Mercari': { pct: 10, flat: 0.50 }, 'COMC': { pct: 5, flat: 0 }, 'MySlabs': { pct: 5.5, flat: 0 } },
};

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/[$,]/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
function money(n, sign) { n = +n || 0; if (Math.abs(n) < 0.005) n = 0; const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (n < 0 ? '-' : sign && n > 0 ? '+' : '') + '$' + s; }
function money0(n, sign) { n = +n || 0; if (Math.abs(n) < 0.5) n = 0; const s = Math.round(Math.abs(n)).toLocaleString('en-US'); return (n < 0 ? '-' : sign && n > 0 ? '+' : '') + '$' + s; }
const pct = n => isFinite(n) && n !== null ? (n > 0 ? '+' : '') + Math.round(n * 100) + '%' : '—';
const cls = n => n > 0.004 ? 'pos' : n < -0.004 ? 'neg' : '';
const fmtDate = d => d ? new Date(d.slice(0, 10) + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
const daysBetween = (a, b) => Math.max(0, Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 864e5));
const opts = (list, sel, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${String(v) === String(sel ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join('');
const uniq = arr => [...new Set(arr.filter(x => x !== undefined && x !== null && x !== ''))].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
function hue(s) { let h = 0; for (const ch of String(s || '')) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
function csv(rows) { return rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n'); }
const appBase = () => location.href.split('#')[0];

function toast(msg, action) {
  const box = $('#toast'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.run(); el.remove(); }; el.appendChild(b); }
  box.appendChild(el); setTimeout(() => el.remove(), action ? 7000 : 3200);
}

/* ---------- model helpers ---------- */
const live = c => c && !c.deletedAt && !c.purged;
const cardById = id => S.cards.find(c => c.id === id);
const byCode = code => S.cards.find(c => live(c) && String(c.code).toLowerCase() === String(code).toLowerCase());
const boxByCode = code => S.locations.find(l => !l.purged && String(l.code).toLowerCase() === String(code).toLowerCase());
const pickupById = id => S.pickups.find(p => p.id === id && !p.purged);
const locById = id => S.locations.find(l => l.id === id && !l.purged);
function unitCost(c) { const b = c.buy || {}; const q = Math.max(1, +b.qty || 1); return (num(b.price) + num(b.ship) + num(b.tax) + num(b.fees) + num(c.extraCost)) / q; }
const inHand = c => live(c) && ACTIVE.includes(c.status) ? (+c.qty || 0) : 0;
const cardName = c => `${c.player || 'Unnamed card'}${c.number ? ' #' + c.number : ''}`;
const cardSet = c => [c.year, c.brand, c.set].filter(Boolean).join(' ');

}

async function hydrate(root) {

/* value-over-time line chart */
function valueChart(snaps) {
  const pts = [...snaps].filter(s => !s.purged).sort((a, b) => a.date.localeCompare(b.date));
  if (pts.length < 2) return `<div class="empty">The chart fills in as you use Dugout. It saves your totals once a day.</div>`;
  const W = 640, H = 220, L = 58, R = 12, T = 12, B = 26;
  const xs = pts.map(p => +new Date(p.date)); const x0 = xs[0], x1 = xs[xs.length - 1] || x0 + 1;
  const maxV = Math.max(...pts.map(p => Math.max(p.value, p.cost)), 1);
  const step = niceStep(maxV / 4); const top = Math.ceil(maxV / step) * step;
  const X = t => L + (W - L - R) * ((t - x0) / Math.max(1, x1 - x0)); const Y = v => T + (H - T - B) * (1 - v / top);
  const line = k => pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p[k]).toFixed(1)}`).join('');
  const area = line('value') + `L${X(x1).toFixed(1)},${Y(0)}L${X(x0).toFixed(1)},${Y(0)}Z`;
  let grid = ''; for (let v = 0; v <= top + 1e-6; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${money0(v)}</text>`;
  const ticks = [0, Math.floor(pts.length / 2), pts.length - 1].map(i => `<text x="${X(xs[i])}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${new Date(pts[i].date + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</text>`).join('');
  const last = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Inventory value and cost over time">${grid}${ticks}
    <path d="${area}" fill="var(--acc)" opacity=".12"/>
    <path d="${line('cost')}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${line('value')}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>
    <circle cx="${X(x1)}" cy="${Y(last.value)}" r="4.5" fill="var(--acc)"/></svg>
    <div class="legend"><span><i style="background:var(--acc)"></i>Value ${money0(last.value)}</span><span><i style="background:var(--muted)"></i>Cost ${money0(last.cost)}</span></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1e-9)))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }

const F = { q: '', sport: '', status: 'active', brand: '', year: '', player: '', min: '', max: '', sort: 'new', box: '' };
function filterCards(f = F) {
  const q = f.q.trim().toLowerCase();
  let list = S.cards.filter(live).filter(c => {
    if (f.status === 'active' && !ACTIVE.includes(c.status)) return false;
    if (f.status && f.status !== 'active' && f.status !== 'all' && c.status !== f.status) return false;
    if (f.sport && c.sport !== f.sport) return false;
    if (f.brand && c.brand !== f.brand) return false;
    if (f.year && String(c.year) !== String(f.year)) return false;
    if (f.player && !String(c.player || '').toLowerCase().includes(f.player.toLowerCase())) return false;
    if (f.box && c.locationId !== f.box) return false;
    if (f.min !== '' && num(c.value) < num(f.min)) return false;
    if (f.max !== '' && num(c.value) > num(f.max)) return false;
    if (q) { const hay = [c.code, c.player, c.team, c.brand, c.set, c.year, c.number, c.parallel, c.serial, c.notes, c.gradeCo, c.grade, c.sport].join(' ').toLowerCase(); if (!q.split(/\s+/).every(w => hay.includes(w))) return false; }
    return true;
  });
  const prof = c => num(c.value) - unitCost(c);
  const sorts = {
    new: (a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''), old: (a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''),
    value: (a, b) => num(b.value) - num(a.value), profit: (a, b) => prof(b) - prof(a),
    roi: (a, b) => prof(b) / Math.max(unitCost(b), .01) - prof(a) / Math.max(unitCost(a), .01),
    player: (a, b) => String(a.player).localeCompare(String(b.player)), stale: (a, b) => (a.priceUpdated || '').localeCompare(b.priceUpdated || ''),
  };
  return list.sort(sorts[f.sort] || sorts.new);
}

const kv = (k, v, raw) => `<div><span>${esc(k)}</span><b>${raw ? (v || '—') : esc(v === undefined || v === null || v === '' ? '—' : v)}</b></div>`;
function sparkline(h) {
  const W = 300, H = 60, vs = h.map(x => num(x.value)); const mn = Math.min(...vs), mx = Math.max(...vs); const span = mx - mn || 1;
  const d = vs.map((v, i) => `${i ? 'L' : 'M'}${(4 + (W - 8) * i / (vs.length - 1)).toFixed(1)},${(6 + (H - 12) * (1 - (v - mn) / span)).toFixed(1)}`).join('');
  const lx = W - 4, ly = 6 + (H - 12) * (1 - (vs[vs.length - 1] - mn) / span);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:340px" aria-label="Price history"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2"/><circle cx="${lx}" cy="${ly}" r="3.5" fill="var(--acc)"/></svg>`;
}
function receiptTile(r) {
  const n = (r.cardIds || []).length;

}

async function submitCard(f) {
  const id = f.dataset.id; const fd = new FormData(f);
  const old = id ? cardById(id) : null;
  const c = old ? structuredClone(old) : { id: 'c_' + uid(), code: nextCode(), createdAt: nowISO(), priceHistory: [] };
  CARD_FIELDS.forEach(k => { c[k] = String(fd.get(k) ?? '').trim(); });
  c.rookie = fd.get('rookie') === 'on'; c.auto = fd.get('auto') === 'on'; c.patch = fd.get('patch') === 'on';
  c.graded = fd.get('graded') === 'graded';
  if (!c.graded) { c.gradeCo = ''; c.grade = ''; } else c.condition = '';
  c.buy = Object.assign(c.buy || {}, { date: fd.get('b_date') || today(), platform: String(fd.get('b_platform') || '').trim(), qty: Math.max(1, parseInt(fd.get('b_qty'), 10) || 1), price: num(fd.get('b_price')), ship: num(fd.get('b_ship')), tax: num(fd.get('b_tax')), fees: num(fd.get('b_fees')), order: String(fd.get('b_order') || '').trim(), pickupId: fd.get('b_pickup') || '' });
  c.status = fd.get('status') || 'in_stock';
  c.qty = old ? Math.max(0, parseInt(fd.get('qty'), 10) || 0) : c.buy.qty;
  const newVal = fd.get('value') === '' ? (old ? old.value : 0) : num(fd.get('value'));
  if (!old || num(old.value) !== newVal) { c.value = newVal; c.priceHistory = [...(c.priceHistory || []), { date: today(), value: newVal }]; c.priceUpdated = today(); }
  const tl = fd.get('toploader') === 'on'; if (!!S.settings.toploader !== tl) { S.settings.toploader = tl; await saveSettings(); } // remembered for next time
  for (const side of ['front', 'back']) {
    const file = fd.get(side);
    if (file && file.size) {
      for (const k of [side, side + 'Orig']) if (c[k]) await fileDel(c[k]);
      const r = await processCardPhoto(file, fd.get('autocrop') === 'on', fd.get('toploader') === 'on');
      c[side + 'Orig'] = await fileSave(r.orig, file.name);
      c[side] = r.out === r.orig ? c[side + 'Orig'] : await fileSave(await compressImage(r.out), side + '.jpg');
      c[side + 'Quad'] = r.quad ? r.quad.map(p => [Math.round(p[0]), Math.round(p[1])]) : null;
    }
  }
  await save('cards', c, { quiet: true });
  if (!old) await logTxn({ cardId: c.id, type: 'buy', date: c.buy.date, qty: c.buy.qty, amount: r2(c.buy.price + c.buy.ship + c.buy.tax + c.buy.fees), platform: c.buy.platform });
  else {
    const labels = { player: 'Player', number: 'Card #', brand: 'Brand', set: 'Set', year: 'Year', sport: 'Sport', team: 'Team', parallel: 'Parallel', serial: 'Serial', grade: 'Grade', gradeCo: 'Grader', condition: 'Condition', status: 'Status', qty: 'Qty', locationId: 'Box' };
    const changes = Object.keys(labels).filter(k => String(old[k] ?? '') !== String(c[k] ?? '')).map(k => ({ f: labels[k], from: k === 'locationId' ? (locById(old[k]) || {}).code : String(old[k] ?? ''), to: k === 'locationId' ? (locById(c[k]) || {}).code : String(c[k] ?? '') }));
    ['price', 'ship', 'tax', 'fees', 'qty', 'date', 'platform'].forEach(k => { if (String((old.buy || {})[k] ?? '') !== String(c.buy[k] ?? '')) changes.push({ f: 'Purchase ' + k, from: String((old.buy || {})[k] ?? ''), to: String(c.buy[k]) }); });
    if (changes.length) await logTxn({ cardId: c.id, type: 'edit', date: today(), changes });
  }
  onChange('cards');
  closeModal(false);
  toast(old ? 'Saved' : `Added ${c.code}`);
  if (!old) location.hash = '#/card/' + c.id; else route();
}

    ${field('Platform sold on', inp('platform', 'eBay', 'list="dl-platforms"'))}
    ${field('Shipping cost (you paid)', money_inp('ship', ''))}

  </div>
  <div class="calc" id="sell-calc"></div><small class="muted" id="fee-note"></small>
  ${platformList()}${mfoot('Mark as sold')}</form>`, { narrow: true });
  const f = $('#modal-root form'); let feeTouched = false;
  $('#fee-in').addEventListener('input', () => { feeTouched = true; });
  const upd = () => {
    const fd = new FormData(f); const q = Math.min(Math.max(1, parseInt(fd.get('qty'), 10) || 1), c.qty || 1);

    const net = gross - num(fd.get('ship')) - num($('#fee-in').value); const cost = uc * q;

async function submitSell(f) {

  c.qty = (c.qty || 0) - q; if (c.qty <= 0) { c.qty = 0; c.status = 'sold'; c.soldAt = t.date; }

async function submitSimple(f) {
  const c = cardById(f.dataset.id); const fd = new FormData(f); const kind = f.dataset.kind; const date = fd.get('date') || today();
  const q = Math.min(Math.max(1, parseInt(fd.get('qty'), 10) || 1), c.qty || 1);
  if (kind === 'trade' || kind === 'writeoff') {
    const cost = r2(unitCost(c) * q); const val = kind === 'trade' ? num(fd.get('value')) : 0;
    await logTxn({ cardId: c.id, type: kind, date, qty: q, amount: val, net: val, cost, profit: r2(val - cost), platform: kind === 'trade' ? 'Trade' : '', note: String(fd.get('note') || '') });
    c.qty -= q; if (c.qty <= 0) { c.qty = 0; c.status = kind === 'trade' ? 'sold' : 'written_off'; c.soldAt = date; }
    await save('cards', c, { quiet: true }); onChange('txns');
    closeModal(false);
    if (kind === 'trade' && fd.get('addNew') === 'on') { toast('Trade logged. Now add the card you received.'); openCardForm(null, { buy: { date, platform: 'Trade', qty: 1, price: val }, value: val }); }
    else { route(); toast(kind === 'trade' ? 'Trade logged' : 'Written off'); }
    return;
  }
  if (kind === 'gradeOut') {
    const fee = num(fd.get('fee')); c.extraCost = r2(num(c.extraCost) + fee); c.status = 'grading'; c.gradeCo = fd.get('co');
    await logTxn({ cardId: c.id, type: 'grading_out', date, amount: fee, platform: fd.get('co'), note: String(fd.get('note') || '') });
  } else {
    const fee = num(fd.get('fee')); c.extraCost = r2(num(c.extraCost) + fee);
    c.graded = true; c.gradeCo = fd.get('co'); c.grade = String(fd.get('grade')).trim(); c.condition = ''; c.status = 'in_stock';
    if (fd.get('value') !== '' && num(fd.get('value')) !== num(c.value)) { c.value = num(fd.get('value')); c.priceHistory = [...(c.priceHistory || []), { date, value: c.value }]; c.priceUpdated = date; }
    await logTxn({ cardId: c.id, type: 'grading_in', date, amount: fee, platform: c.gradeCo, note: `${c.gradeCo} ${c.grade}` });
  }
  await save('cards', c, { quiet: true }); onChange('cards'); closeModal(); toast('Saved');
}
async function updatePrice(id, value) {
  const c = cardById(id); const v = num(value); if (!String(value).trim()) return;
  const from = num(c.value); c.value = v; c.priceUpdated = today();
  c.priceHistory = [...(c.priceHistory || []), { date: today(), value: v }];
  await save('cards', c, { quiet: true });
  await logTxn({ cardId: id, type: 'price', date: today(), amount: v, from });
  onChange('cards');
}

async function submitPickup(f) {

      buy: { date: p.date, platform: p.platform || 'Card show', qty: 1, price: alloc[i], ship: 0, tax: 0, fees: 0, pickupId: p.id } };
    await save('cards', c, { quiet: true }); ids.push(c.id);

function allocate(total, weights, mode) {
  const n = weights.length; const sum = weights.reduce((a, b) => a + b, 0);
  const raw = weights.map(w => mode === 'value' && sum > 0 ? total * w / sum : total / n);
  const out = raw.map(r2); const diff = r2(total - out.reduce((a, b) => a + b, 0)); out[0] = r2(out[0] + diff); // pennies land on the first card
  return out;
}
async function resplitPickup(pid, mode) {
  const p = pickupById(pid); const cards = S.cards.filter(c => live(c) && c.buy && c.buy.pickupId === pid);
  if (!cards.length) return;
  const alloc = allocate(num(p.total), cards.map(c => num(c.value)), mode);
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i]; const prevUnit = unitCost(c); c.buy.price = alloc[i]; await save('cards', c, { quiet: true });
    // keep sold profit consistent with the new cost
    for (const t of S.txns.filter(t => t.cardId === c.id && ['sell', 'trade', 'writeoff'].includes(t.type))) { t.cost = r2(unitCost(c) * (t.qty || 1)); t.profit = r2(num(t.net) - t.cost); await save('txns', t, { quiet: true }); }
    void prevUnit;
  }
  onChange('pickups'); toast('Cost re-split across ' + cards.length + ' cards');
}

function bindEvents() {

    try { await FORMS[f.dataset.form](f, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message); } finally { if (btn) btn.disabled = false; }
  });

function monthBars(months) {
  const W = 640, H = 220, L = 54, R = 8, T = 12, B = 24;
  const vals = months.map(m => m.profit - m.sup); const mx = Math.max(...vals, 0), mn = Math.min(...vals, 0);
  if (mx === 0 && mn === 0) return '<div class="empty">No sales in this year yet.</div>';
  const step = niceStep((mx - mn) / 4 || 1); const top = Math.ceil(mx / step) * step, bot = Math.floor(mn / step) * step;
  const Y = v => T + (H - T - B) * (top - v) / Math.max(top - bot, 1); const bw = (W - L - R) / 12;
  let g = ''; for (let v = bot; v <= top + 1e-6; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${money0(v)}</text>`;
  const bars = vals.map((v, i) => { const y = Math.min(Y(v), Y(0)), h = Math.max(1, Math.abs(Y(v) - Y(0))); return `<rect x="${L + i * bw + bw * .18}" y="${y}" width="${bw * .64}" height="${h}" rx="3" fill="${v >= 0 ? 'var(--pos)' : 'var(--neg)'}"><title>${months[i].label}: ${money(v, 1)}</title></rect><text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${months[i].label[0]}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net profit by month">${g}${bars}<line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/></svg><div class="legend"><span>Net profit after supplies · year total <b class="num ${cls(vals.reduce((a, b) => a + b, 0))}">${money(vals.reduce((a, b) => a + b, 0), 1)}</b></span></div>`;
}

async function startScan() {
  const msg = $('#scan-msg'); const video = $('#scan-video');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = 'This browser can\'t open the camera here. Type the ID instead, or open Dugout from its GitHub Pages address.'; return; }
  try {
    SC.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    if (curView !== 'scan') return stopScan();
    video.srcObject = SC.stream; await video.play();
    msg.textContent = 'Point at a Dugout QR label.';
    const cv = document.createElement('canvas'); const ctx = cv.getContext('2d', { willReadFrequently: true });
    const tick = () => {
      if (!SC.stream) return;
      if (video.readyState >= 2 && window.jsQR) {
        const k = Math.min(1, 640 / video.videoWidth); cv.width = video.videoWidth * k; cv.height = video.videoHeight * k;
        ctx.drawImage(video, 0, 0, cv.width, cv.height);
        const code = jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data && code.data !== SC.last) { SC.last = code.data; setTimeout(() => { SC.last = ''; }, 2500); if (handleScan(code.data) !== false) return; }
      }
      SC.raf = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { msg.textContent = e.name === 'NotAllowedError' ? 'Camera access was blocked. Allow the camera for this site in Safari settings, then reload. You can still type an ID below.' : 'Camera unavailable: ' + e.message; }
}
function stopScan() { cancelAnimationFrame(SC.raf); if (SC.stream) { SC.stream.getTracks().forEach(t => t.stop()); SC.stream = null; } }
function handleScan(text) {
  let m, code = text;
  if ((m = text.match(/#b\/([^#?]+)/))) { const b = boxByCode(decodeURIComponent(m[1])); if (b) { if (navigator.vibrate) navigator.vibrate(60); location.hash = '#/box/' + b.id; return; } }
  if ((m = text.match(/#c\/([^#?]+)/))) code = decodeURIComponent(m[1]);
  const box = boxByCode(code); if (box) { location.hash = '#/box/' + box.id; return; }
  const c = byCode(code);
  if (!c) { const msg = $('#scan-msg'); if (msg) msg.textContent = `No card with ID "${code}" on this device.`; else toast(`No card with ID "${code}"`); return false; }
  if (navigator.vibrate) navigator.vibrate(60);
  if (SC.mode === 'find') { Object.assign(F, { q: c.code, status: 'all' }); location.hash = '#/inv'; return; }
  location.hash = '#/card/' + c.id;
  if (SC.mode === 'sell') setTimeout(() => { if (ACTIVE.includes(c.status) && c.qty > 0) openSell(c.id); else toast(`${c.code} is already ${STATUS[c.status].toLowerCase()}`); }, 150);
}

    const edge = SPORT_EDGE[sport] + (rookie ? 0.15 : -0.05) + (graded ? 0.12 : 0) + (parallel === 'Base' ? -0.08 : 0.1) + (rnd() - 0.5) * 0.5;
    const value = r2(price * (1 + edge));
    const ship = pk ? 0 : r2(rnd() < 0.5 ? 0 : 4.5);
    const c = { id: 'c_demo' + i, code: prefix + String(++n).padStart(S.settings.digits || 4, '0'), demo: true, createdAt: new Date(Date.now() - bdays * 864e5).toISOString(),
      player, number: String(1 + Math.floor(rnd() * 300)), brand, set, year: String(year), sport, team, parallel, serial: /\//.test(parallel) ? Math.ceil(rnd() * 199) + parallel.slice(parallel.indexOf('/')) : '',
      rookie, auto, patch, graded, gradeCo, grade, condition: graded ? '' : pick(['Near Mint-Mint', 'Near Mint', 'Mint']), notes: '', status: 'in_stock', qty: 1, value,
      priceUpdated: day(Math.floor(rnd() * 40)), priceHistory: [{ date: day(bdays), value: price }, { date: day(Math.floor(bdays / 2)), value: r2((price + value) / 2) }, { date: day(3), value }],
      locationId: graded ? locs[2].id : sport === 'Basketball' ? locs[0].id : locs[1].id,
      buy: { date: pk ? pk.date : day(bdays), platform: pk ? pk.platform : pick(SRC), qty: 1, price, ship, tax: 0, fees: 0, order: pk ? '' : String(10000000 + Math.floor(rnd() * 8e7)), pickupId: pk ? pk.id : '' } };
    cards.push(c);
    txns.push({ id: 't_demob' + i, cardId: c.id, type: 'buy', date: c.buy.date, qty: 1, amount: r2(price + ship), platform: c.buy.platform, demo: true, createdAt: c.createdAt });
    const age = daysBetween(c.buy.date, today());
    if (rnd() < 0.62 && age > 10) {
      const sdate = day(Math.max(0, age - (5 + Math.floor(rnd() * Math.min(age - 5, sport === 'Basketball' ? 35 : 80)))));
      const plat = pick(SOLD); const gross = r2(value * (0.9 + rnd() * 0.25));
      const fees = feeFor(plat, gross); const shipping = plat === 'Card show' || plat === 'Facebook Marketplace' ? 0 : (graded ? 5.5 : 1.25);
      const cost = r2(unitCost(c)); const net = r2(gross - fees - shipping);
      txns.push({ id: 't_demos' + i, cardId: c.id, type: 'sell', date: sdate, qty: 1, amount: gross, fees, shipping, net, cost, profit: r2(net - cost), platform: plat, tracking: plat === 'eBay' ? '9400 1000 0000 ' + Math.floor(1000 + rnd() * 8999) : '', demo: true, createdAt: nowISO() });
      c.status = 'sold'; c.qty = 0; c.soldAt = sdate;
    } else if (rnd() < 0.3) c.status = 'listed';
  }
  // split each pickup's total across its cards by value
  for (const p of pickups) {
    const pc = cards.filter(c => c.buy.pickupId === p.id); p.total = Math.round(pc.reduce((a, c) => a + c.value, 0) * 0.62); const alloc = allocate(p.total, pc.map(c => c.value), 'value');
    pc.forEach((c, i) => { c.buy.price = alloc[i]; const t = txns.find(t => t.cardId === c.id && t.type === 'sell'); if (t) { t.cost = r2(unitCost(c)); t.profit = r2(t.net - t.cost); } const b = txns.find(t => t.cardId === c.id && t.type === 'buy'); b.amount = alloc[i]; });
    await save('pickups', p, { quiet: true });
  }
  for (const c of cards) await save('cards', c, { quiet: true });
  for (const t of txns) await save('txns', t, { quiet: true });
  // receipts drawn on the fly
  for (const p of pickups) {
    const blob = await drawReceipt(p.location, p.date, cards.filter(c => c.buy.pickupId === p.id).map(c => [c.player.split(' ').pop() + ' ' + c.set, c.buy.price]), p.total);
    const fileId = await fileSave(blob, 'receipt.png');
    await save('receipts', { id: 'r_demo_' + p.id, fileId, fileType: 'image/png', date: p.date, amount: p.total, note: 'Pickup · ' + p.location, pickupId: p.id, cardIds: cards.filter(c => c.buy.pickupId === p.id).map(c => c.id), demo: true, createdAt: nowISO() }, { quiet: true });
  }
  await save('expenses', { id: 'x_demo1', date: day(60), amount: 34.99, cat: EXPENSE_CATS[0], note: '300 top loaders + penny sleeves', demo: true, createdAt: nowISO() }, { quiet: true });
  await save('expenses', { id: 'x_demo2', date: day(30), amount: 21.5, cat: EXPENSE_CATS[1], note: 'Bubble mailers', demo: true, createdAt: nowISO() }, { quiet: true });
  // weekly value snapshots
  const sales = new Map(txns.filter(t => t.type === 'sell').map(t => [t.cardId, t.date]));
  for (let w = 36; w >= 0; w--) {
    const d = day(w * 7); let value = 0, cost = 0;
    for (const c of cards) { if (c.buy.date > d) continue; const sd = sales.get(c.id); if (sd && sd <= d) continue; const span = Math.max(1, daysBetween(c.buy.date, today())); const k = Math.min(1, daysBetween(c.buy.date, d) / span); value += unitCost(c) + (c.value - unitCost(c)) * k; cost += unitCost(c); }
    await save('snaps', { id: d, date: d, value: r2(value), cost: r2(cost), demo: true }, { quiet: true });
  }
  try { localStorage.setItem('dugout.welcomed', '1'); } catch (e) {}
  onChange('demo'); toast('Demo cards loaded. Remove them any time in Settings.');
}
async function drawReceipt(store, date, items, total) {
  const cv = document.createElement('canvas'); cv.width = 520; cv.height = 220 + items.length * 34; const g = cv.getContext('2d');
  g.fillStyle = '#fbfbf8'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#222'; g.textBaseline = 'top';
  g.font = 'bold 26px monospace'; g.fillText(store.toUpperCase().slice(0, 30), 28, 28);
  g.font = '18px monospace'; g.fillText(fmtDate(date) + '  · CASH', 28, 66); g.fillText('-'.repeat(40), 28, 92);
  items.forEach(([n, p], i) => { g.fillText(n.slice(0, 28), 28, 120 + i * 34); g.fillText(money(p), 400, 120 + i * 34); });
  const y = 120 + items.length * 34; g.fillText('-'.repeat(40), 28, y + 4); g.font = 'bold 22px monospace'; g.fillText('TOTAL', 28, y + 34); g.fillText(money(total), 380, y + 34);
  return new Promise(r => cv.toBlob(r, 'image/png'));
}

/* Boot */
(async function boot() {
  try { await loadAll(); } catch (e) { S.settings = structuredClone(DEFAULT_SETTINGS); }
  if (!S.settings) S.settings = structuredClone(DEFAULT_SETTINGS);
  applyTheme(); shell(); bindEvents();
  if (!DB.db) toast('This browser blocked local storage, so changes won\'t be kept. Open Dugout in Safari or Chrome directly.');
  onChange = store => {
    if (store !== 'settings' || true) snapshotSoon();
    scheduleSync();
    applyTheme();
    if (store === 'settings' && curView === 'inv') { updateInv(); route(); return; }
    rerender();
  };
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => scheduleSync());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && syncCfg()) syncNow(); });
  await route();
  if (S.cards.length) snapshotSoon();
  if (syncCfg()) syncNow();
})();
</script>
